plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

group = 'me.gaurang'
version = '1.0.4'

base {
    archivesName = 'sellmod'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:26.1"
    implementation "net.fabricmc:fabric-loader:0.18.6"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:0.145.1+26.1"
    
    // implementation "net.fabricmc.fabric-api:fabric-screen-api-v1:0.145.1+26.1"

    // Mod Menu (client)
    compileOnly "com.terraformersmc:modmenu:18.0.0-alpha.8"

    // Cloth Config (client)
    implementation "me.shedaniel.cloth:cloth-config-fabric:26.1.154"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

jar {
    from("LICENSE")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}